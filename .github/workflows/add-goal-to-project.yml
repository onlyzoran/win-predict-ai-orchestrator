name: Add Goal to project

on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: read

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Add Goal to ai-engineering-autopilot (Inbox)
        env:
          GH_TOKEN: ${{ github.token }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          chmod +x .github/scripts/add-goal-to-project.sh
          .github/scripts/add-goal-to-project.sh \
            "${{ github.event.issue.html_url }}" \
            "${{ github.event.issue.number }}" \
            "${{ github.repository_owner }}" \
            "${{ github.event.repository.name }}"
