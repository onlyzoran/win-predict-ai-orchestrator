name: orchestrate

on:
  issue_comment:
    types: [created]

concurrency:
  group: orchestrate-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  orchestrate:
    if: >-
      github.event.issue.pull_request == null &&
      contains(github.event.comment.body, '/orchestrate')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          domain: https://secrets.win-predict-ai.com
          project-slug: win-predict-ai-s-vm-f
          env-slug: prod
          export-type: env
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Decompose Goal, open issues, dispatch workers
        env:
          # App secrets (CURSOR_API_KEY, GITHUB_PAT, TELEGRAM_*) come from Infisical above.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSOR_MACHINE_NAME: win-predict-vps
        run: npm run orchestrate
