name: win-predict-ai
description: Цель для семьи win-predict-ai (ui / app / admin / ios / …).
labels: ["goal", "product:win-predict-ai"]
body:
  - type: markdown
    attributes:
      value: |
        Продукт: **win-predict-ai**. Карточка Inbox → In Progress (или `/orchestrate`) — оркестратор создаст крупные child
        (обычно одно на отмеченную поверхность) в рабочих репо. Отмечай только нужные поверхности.
        Правки после Review: комментарий в этот issue и карточка снова In Progress.
        Приёмка: «релизь» / «можно релизить» и Review → In Progress.
  - type: textarea
    id: outcome
    attributes:
      label: Результат
      description: Что должно быть правдой, когда цель закрыта. Один абзац.
      placeholder: В админке можно задать порядок туров, на фронте он отображается в виджете турнира.
    validations:
      required: true
  - type: checkboxes
    id: surfaces
    attributes:
      label: Поверхности
      description: Где ожидаются изменения. Оркестратор может сузить или расширить список.
      options:
        - label: ui (`win-predict-ai-ui`)
        - label: icons (`win-predict-ai-icons`)
        - label: data (`win-predict-ai-data`)
        - label: app (`win-predict-ai`)
        - label: admin (`win-predict-ai-admin`)
        - label: ios (`win-predict-ai-ios`)
  - type: textarea
    id: constraints
    attributes:
      label: Ограничения
      description: Что нельзя трогать, какой стиль, дедлайн, зависимость от человека (выбор иконки, приёмка).
      placeholder: Не менять семантические токены. Иконку выбираю сам в PR.
  - type: textarea
    id: done
    attributes:
      label: Критерий готовности
      description: Проверяемые условия. Без этого оркестратор не знает, когда Goal → Done.
      placeholder: |
        - PR в затронутых репо зелёные
        - Пакеты опубликованы и подтянуты в app/admin, если менялись ui/icons
        - Коротко видно в UI / админке
    validations:
      required: true
