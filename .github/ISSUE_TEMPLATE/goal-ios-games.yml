name: ios-games
description: Цель для iOS-игр. Рабочие репо пока не подключены.
labels: ["ios-games"]
body:
  - type: markdown
    attributes:
      value: |
        Продукт: **ios-games**. Шаблон: [onlyzoran/ios-template-game](https://github.com/onlyzoran/ios-template-game).
        In Progress → оркестратор создаст `onlyzoran/game-issue-<номер>` и откроет PR в этом репо.
  - type: textarea
    id: outcome
    attributes:
      label: Результат
      description: Что должно быть правдой, когда цель закрыта.
    validations:
      required: true
