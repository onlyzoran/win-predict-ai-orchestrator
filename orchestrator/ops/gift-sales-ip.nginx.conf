# HTTP по IP (202.71.15.138): /ops/ и /gift-sales/
# HTTPS по IP — отдельный default_server: gift-sales-ip-ssl.nginx.conf.example
# (иначе первый 443-vhost — HQ SPA).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 202.71.15.138 _;

    location = /ops {
        return 301 /ops/;
    }

    location ^~ /ops/ {
        alias /var/www/orchestrator-status/;
        index index.html;
        add_header Cache-Control "no-store";
    }

    include /etc/nginx/snippets/gift-sales.conf;
    include /etc/nginx/snippets/shoppable-feed.conf;
}
