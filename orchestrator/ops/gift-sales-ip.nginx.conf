# HTTP по IP (202.71.15.138): /ops/ и /gift-sales/
# include один раз на уровне http { } или отдельным server { } default_server

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 202.71.15.138 _;

    location = /ops {
        return 301 /ops/;
    }

    location ^~ /ops/ {
        alias /var/www/orchestrator-status/;
        index index.html;
        add_header Cache-Control "no-store";
    }

    include /etc/nginx/snippets/gift-sales.conf;
}
