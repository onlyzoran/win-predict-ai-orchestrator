# gift-sales.store — прод Next.js на корне (порт 3002, без basePath).
# Preview Goal: https://gift-sales.store/preview/issue-<N>/ (порт 3005).
# include внутри server { server_name gift-sales.store ... }

location /.well-known/acme-challenge/ {
    root /var/www/html;
}

# Dynamic Next.js preview (свой basePath /preview/issue-<N>)
location ^~ /preview/ {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    add_header Cache-Control "no-store";
}

# Preview UI ходит в прод API по /gift-sales/api/ (тот же origin, что домен).
location ^~ /gift-sales/api/ {
    rewrite ^/gift-sales/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /gift-sales/preview/ {
    rewrite ^/gift-sales/preview/(.*)$ /preview/$1 permanent;
}

# Старый прод-путь → корень
location = /gift-sales {
    return 301 /;
}

location /gift-sales/ {
    rewrite ^/gift-sales/(.*)$ /$1 permanent;
}

# Хешированные чанки с диска — next start после деплоя иногда 404'ит JS
location ^~ /_next/static/ {
    alias /var/www/gift-sales/.next/static/;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location / {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
