# shoppable-feed Next.js: http://<ip>/shoppable-feed/
# preview по Goal: http://<ip>/shoppable-feed/preview/issue-<N>/
# include внутри server { listen 80; ... }, до location /

location = /shoppable-feed {
    return 301 /shoppable-feed/;
}

# Статический preview (legacy) + dynamic Next.js preview (API routes) на порту 3004
location ^~ /shoppable-feed/preview/ {
    proxy_pass http://127.0.0.1:3004;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    add_header Cache-Control "no-store";
}

# Прод: reverse proxy на Next.js (systemd shoppable-feed.service, порт 3003, basePath /shoppable-feed)
location /shoppable-feed/ {
    proxy_pass http://127.0.0.1:3003;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
