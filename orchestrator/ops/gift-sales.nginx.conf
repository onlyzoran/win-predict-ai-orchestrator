# gift-sales Next.js: http://<ip>/gift-sales/
# preview по Goal: http://<ip>/gift-sales/preview/issue-<N>/
# include внутри server { listen 80; ... }, до location /

location = /gift-sales {
    return 301 /gift-sales/;
}

# Dynamic Next.js preview (API routes) на порту 3005
location ^~ /gift-sales/preview/ {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    add_header Cache-Control "no-store";
}

# Хешированные чанки с диска — next start после деплоя иногда 404'ит JS, пока процесс не перечитает .next
location ^~ /gift-sales/_next/static/ {
    alias /var/www/gift-sales/.next/static/;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Прод: reverse proxy на Next.js (systemd gift-sales.service, порт 3002, basePath /gift-sales)
location /gift-sales/ {
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
