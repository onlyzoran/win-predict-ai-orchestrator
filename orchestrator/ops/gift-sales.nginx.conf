# gift-sales на IP: preview + редирект прода на домен.
# preview по Goal: http://<ip>/gift-sales/preview/issue-<N>/
# прод: https://gift-sales.store/
# include внутри server { listen 80; ... }, до location /

# Dynamic Next.js preview (API routes) на порту 3005
location ^~ /gift-sales/preview/ {
    proxy_pass http://127.0.0.1:3005;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    add_header Cache-Control "no-store";
}

# Preview UI ходит в прод API по /gift-sales/api/ (тот же origin, что IP).
location ^~ /gift-sales/api/ {
    rewrite ^/gift-sales/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /gift-sales {
    return 301 https://gift-sales.store/;
}

location /gift-sales/ {
    rewrite ^/gift-sales/(.*)$ https://gift-sales.store/$1 permanent;
}
