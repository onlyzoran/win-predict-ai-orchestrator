# gift-sales на IP: редирект прода и preview на домен.
# preview: https://gift-sales.store/preview/issue-<N>/
# прод: https://gift-sales.store/
# include внутри server { listen 80; ... }, до location /

location ^~ /gift-sales/preview/ {
    rewrite ^/gift-sales/preview/(.*)$ https://gift-sales.store/preview/$1 permanent;
}

# Preview UI ходит в прод API по /gift-sales/api/ (тот же origin, что IP).
location ^~ /gift-sales/api/ {
    rewrite ^/gift-sales/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /gift-sales {
    return 301 https://gift-sales.store/;
}

location /gift-sales/ {
    rewrite ^/gift-sales/(.*)$ https://gift-sales.store/$1 permanent;
}
