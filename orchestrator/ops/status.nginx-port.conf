# Отдельный порт, если не хочется трогать Nuxt на :80.
# enable: ln -s /etc/nginx/sites-available/orchestrator-status /etc/nginx/sites-enabled/
# URL: http://<ip>:8787/

server {
    listen 8787 default_server;
    listen [::]:8787 default_server;
    server_name _;
    root /var/www/orchestrator-status;
    index index.html;
    add_header Cache-Control "no-store";

    location / {
        try_files $uri $uri/ /index.html;
    }
}
